<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Ed Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title">📚 Ed Downloader</div>
    <div class="subtitle">扫描后选择要备份的 Lessons / 公告</div>
  </header>

  <main>
    <div id="status" class="status hint">在 Ed 课程页里点 "扫描" 开始</div>

    <div class="actions">
      <button id="scan" class="btn primary">扫描当前课程</button>
      <button id="download" class="btn" disabled>下载已选</button>
    </div>

    <section id="preview" class="preview" hidden>
      <div class="preview-header">
        <strong id="course-name"></strong>
        <span id="course-id" class="muted"></span>
      </div>
      <div class="counts">
        <span class="chip">📁 Lessons: <b id="cnt-lessons">0</b></span>
        <span class="chip">🧩 Slides: <b id="cnt-slides">0</b></span>
        <span class="chip">📄 文件: <b id="cnt-files">0</b></span>
        <span class="chip">📢 公告: <b id="cnt-announce">0</b></span>
      </div>
      <div class="selection-toolbar">
        <button id="select-all" class="mini-btn" type="button">全选</button>
        <button id="select-none" class="mini-btn" type="button">清空</button>
        <span id="selected-summary" class="selected-summary">未选择</span>
      </div>
      <details open>
        <summary>选择下载内容</summary>
        <ul id="item-list" class="select-list"></ul>
      </details>
    </section>

    <section class="settings">
      <label>
        <input type="checkbox" id="opt-lessons" checked> 下载 Lessons / Slides / 附件
      </label>
      <label>
        <input type="checkbox" id="opt-announce" checked> 保存公告 / 置顶帖为 Markdown
      </label>
    </section>
  </main>

  <footer>
    <a href="https://github.com" target="_blank" id="help">使用说明</a>
    <span class="muted">v1.3.0 · 仅限个人学习用途</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
